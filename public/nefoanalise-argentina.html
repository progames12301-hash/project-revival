<!doctype html>

<head>
<meta charset="utf-8">

<title>Nefoanálise Argentina | Sideral V3</title>
<meta name="description" content="Nefoanálise do SMN Argentina na Sideral Meteorologia V3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{color-scheme:dark;--bg:#171a20;--panel:#22262e;--panel2:#2b3039;--edge:rgba(255,255,255,.09);--ink:#edf1f7;--muted:#9ba7b7;--red:#ed3448}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}
.container-sideral{width:min(100% - 48px,1480px);margin-inline:auto}.site-header{position:relative;z-index:10;background:#20242c;border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:10px}.brand-lockup{display:flex;align-items:center;gap:11px}.brand{display:inline-flex;align-items:center;text-decoration:none}.brand-logo{display:block;width:150px;height:auto;max-height:55px;object-fit:contain}.root-sign,.root-bar{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.root-value{fill:var(--red);font:700 16px Manrope,sans-serif}.header-nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,32px);flex:1}.header-nav a,.mobile-nav a{color:#e8edf5;font-size:12px;font-weight:700;text-decoration:none}.header-nav a:hover,.mobile-nav a:hover{color:#ff7a87}.header-actions{display:flex;align-items:center}.mobile-menu-button,.mobile-nav{display:none}
.app{height:calc(100vh - 78px);min-height:360px;display:grid;grid-template-columns:258px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:#171a20}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#262b34;border-bottom:1px solid #11151b;min-width:0}.tool-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto;min-width:33px;height:32px;padding:0 10px;background:#2c323c;color:#eaf0f8;border:1px solid #444b57;border-radius:3px;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}.tool-btn:hover{border-color:var(--red)}.toolbar-spacer{flex:1}.toolbar-status{font-size:10px;color:#aab5c4;font-weight:800;white-space:nowrap}
.sidebar{min-width:0;overflow:auto;background:#22262e;border-right:1px solid rgba(0,0,0,.3)}.sidebar-heading{padding:17px 16px;background:#2b3039;border-bottom:1px solid var(--edge)}.sidebar-heading h1{margin:0;font:800 15px/1.25 Manrope,sans-serif;letter-spacing:-.03em}.sidebar-heading p{margin:6px 0 0;color:#a5b0bf;font-size:11px}.sidebar-section{padding:14px 10px;border-bottom:1px solid var(--edge)}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 10px;color:#9ba6b6;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.cycle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.cycle-choice{height:40px;background:#292e37;color:#bcc6d5;border:1px solid var(--edge);border-radius:3px;font-size:12px;font-weight:800}.cycle-choice:hover{border-color:rgba(237,52,72,.6)}.cycle-choice[aria-pressed=true]{background:rgba(237,52,72,.16);border-color:rgba(237,52,72,.6);color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.viewer{min-width:0;min-height:0;display:flex;flex-direction:column;background:#15181e;overflow:hidden}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:43px;padding:7px 13px;background:#1e222a;border-bottom:1px solid var(--edge)}.viewer-title{font:800 12px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-actions{display:flex;gap:6px}.stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:18px;background:#171a20}.preview{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.preview[hidden]{display:none}.stage-placeholder{display:flex;flex-direction:column;align-items:center;gap:15px;color:#98a3b3;text-align:center}.stage-placeholder svg{width:62px;height:62px;stroke:#596474;fill:none;stroke-width:1.1}.stage-placeholder p{margin:0;font-size:11px}.primary-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border:1px solid var(--red);border-radius:3px;background:var(--red);color:white;text-decoration:none;font-size:12px;font-weight:800}.primary-link:hover{background:#c92c40;border-color:#c92c40}.footnote{padding:8px 13px;color:#768292;background:#1c2027;border-top:1px solid var(--edge);font-size:9px}
@media(max-width:900px){.header-inner{gap:12px}.brand-logo{width:125px}.header-nav{gap:12px}.header-nav a{font-size:11px}.app{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:700px){.container-sideral{width:calc(100% - 26px)}.header-inner{min-height:66px}.brand-logo{width:115px;max-height:42px}.root-mark{width:30px}.header-nav{display:none}.mobile-menu-button{display:inline-grid;place-items:center;width:36px;height:36px;background:transparent;color:#fff;border:1px solid #48505c;border-radius:3px}.mobile-nav:not([hidden]){display:flex;flex-direction:column;padding:8px 16px 12px;border-top:1px solid var(--edge)}.mobile-nav a{padding:9px 0}.app{height:auto;min-height:calc(100dvh - 66px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(55vh,1fr);overflow:visible}.toolbar{grid-column:1;padding:5px 6px;gap:4px;flex-wrap:wrap}.sidebar{grid-row:2;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--edge)}.sidebar-section{padding:10px}.cycle-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer{grid-row:3;min-height:55vh}.stage{min-height:55vh;padding:12px}.toolbar-status{font-size:9px}.tool-btn{min-width:29px;height:30px;padding-inline:7px}}
</style>
<link rel="stylesheet" href="css/site-header.css">
</head>
<body>
<header class="site-header"><div class="container-sideral header-inner"><div class="brand-lockup"><a class="brand" href="index.html" aria-label="Sideral Meteorologia"><img class="brand-logo" src="assets/sideral-logo.png" alt="Sideral Meteorologia" width="380" height="213"></a><svg class="root-mark" viewBox="0 0 40 26" width="40" height="26" role="img" aria-label="Sideral V3"><path class="root-sign" d="M1 15 H5.5 L8.5 23.5 L15 2"></path><path class="root-bar" d="M14.2 2 H31.5"></path><text class="root-value" x="23" y="21.5">3</text></svg></div><nav class="header-nav" aria-label="Navegação principal"><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav><div class="header-actions"><button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button></div></div><nav class="mobile-nav" id="mobile-nav" hidden><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav></header>
<main class="app" id="nefoApp">
<div class="toolbar" role="toolbar" aria-label="Controles da nefoanálise"><button class="tool-btn" id="fullscreenBtn" type="button" title="Tela cheia" aria-label="Tela cheia">⛶</button><span class="toolbar-status" id="cycleLabel">SMN · NEFOANÁLISE · 00Z</span><span class="toolbar-spacer"></span><a class="tool-btn" id="openImage" href="https://estaticos.smn.gob.ar/vmsr/satelite/nefo_00_24.jpg" target="_blank" rel="noopener noreferrer">Abrir imagem ↗</a></div>
<aside class="sidebar" id="sidebar"><div class="sidebar-heading"><h1>Nefoanálise Argentina</h1><p>SMN · Satélite</p></div><section class="sidebar-section"><h2 class="section-label">Ciclo UTC</h2><div class="cycle-grid"><button class="cycle-choice" type="button" data-cycle="00" aria-pressed="true">00Z</button><button class="cycle-choice" type="button" data-cycle="12" aria-pressed="false">12Z</button></div></section></aside>
<section class="viewer" id="viewer"><div class="viewer-head"><span class="viewer-title" id="viewerTitle">Nefoanálise · 00Z</span><a class="tool-btn" id="openImageHead" href="https://estaticos.smn.gob.ar/vmsr/satelite/nefo_00_24.jpg" target="_blank" rel="noopener noreferrer">Abrir ↗</a></div><div class="stage"><img class="preview" id="previewImage" alt="Nefoanálise do SMN Argentina, ciclo 00Z" hidden><div class="stage-placeholder" id="placeholder"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 42h46a8 8 0 0 0 0-16 13 13 0 0 0-25-4A11 11 0 0 0 8 42Z"></path><path d="M18 50h28M24 56h16"></path></svg><a class="primary-link" id="openImageMain" href="https://estaticos.smn.gob.ar/vmsr/satelite/nefo_00_24.jpg" target="_blank" rel="noopener noreferrer">Abrir imagem oficial ↗</a></div></div><div class="footnote">A imagem oficial é aberta em uma nova aba.</div></section>
</main>
<script>
(()=>{'use strict';
const BASE='https://estaticos.smn.gob.ar/vmsr/satelite/nefo_';
let cycle='00';
const links=[document.getElementById('openImage'),document.getElementById('openImageHead'),document.getElementById('openImageMain')];
const title=document.getElementById('viewerTitle'),label=document.getElementById('cycleLabel'),img=document.getElementById('previewImage'),placeholder=document.getElementById('placeholder');
function imageUrl(){return BASE+cycle+'_24.jpg';}
function update(){const url=imageUrl();links.forEach(a=>{a.href=url;a.setAttribute('aria-label','Abrir nefoanálise oficial do SMN '+cycle+'Z em nova aba');});title.textContent='Nefoanálise · '+cycle+'Z';label.textContent='SMN · NEFOANÁLISE · '+cycle+'Z';img.alt='Nefoanálise do SMN Argentina, ciclo '+cycle+'Z';document.querySelectorAll('[data-cycle]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cycle===cycle)));img.hidden=true;placeholder.hidden=false;img.onload=()=>{img.hidden=false;placeholder.hidden=true;};img.onerror=()=>{img.hidden=true;placeholder.hidden=false;};img.referrerPolicy='no-referrer';img.src=url;}
document.querySelectorAll('[data-cycle]').forEach(b=>b.addEventListener('click',()=>{cycle=b.dataset.cycle;update();}));
document.getElementById('fullscreenBtn').addEventListener('click',async()=>{try{const el=document.getElementById('viewer');if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen();}catch{}});
document.getElementById('mobileMenuButton').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav'),b=document.getElementById('mobileMenuButton'),open=nav.hidden;nav.hidden=!open;b.setAttribute('aria-expanded',String(open));});
update();
})();
</script>
</body>
</html>
