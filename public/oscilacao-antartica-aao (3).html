<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscilação Antártica (AAO) | Sideral V3</title>
<meta name="description" content="Oscilação Antártica — cartas de índice e previsão da NOAA/CPC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="icon" href="favicon.png" type="image/png">
<style>
:root{color-scheme:dark;--bg:#171a20;--panel:#22262e;--panel2:#2b3039;--edge:rgba(255,255,255,.09);--ink:#edf1f7;--muted:#9ba7b7;--red:#ed3448}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}.container-sideral{width:min(100% - 48px,1480px);margin-inline:auto}
.site-header{position:relative;z-index:10;background:#20242c;border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:10px}.brand-lockup{display:flex;align-items:center;gap:11px}.brand{display:inline-flex;align-items:center}.brand-logo{display:block;width:150px;height:auto;max-height:55px;object-fit:contain}.root-sign,.root-bar{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.root-value{fill:var(--red);font:700 16px Manrope,sans-serif}.header-nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,32px);flex:1}.header-nav a,.mobile-nav a{color:#e8edf5;font-size:12px;font-weight:700;text-decoration:none}.header-nav a:hover,.mobile-nav a:hover{color:#ff7a87}.header-actions{display:flex;align-items:center}.mobile-menu-button,.mobile-nav{display:none}
.app{height:calc(100vh - 78px);min-height:320px;display:grid;grid-template-columns:258px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:#171a20}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:6px 12px;background:#262b34;border-bottom:1px solid #11151b;min-width:0}.tool-btn{display:inline-grid;place-items:center;flex:0 0 auto;min-width:33px;height:32px;padding:0 9px;background:transparent;color:#eaf0f8;border:1px solid transparent;border-radius:3px;font-weight:700}.tool-btn:hover,.tool-btn[aria-pressed=true]{background:rgba(237,52,72,.15);border-color:rgba(237,52,72,.45)}.tool-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.toolbar-spacer{flex:1}.sidebar{min-width:0;overflow:auto;background:#22262e;border-right:1px solid rgba(0,0,0,.3)}.sidebar-heading{padding:17px 16px;background:#2b3039;border-bottom:1px solid var(--edge)}.sidebar-heading h1{margin:0;font:800 15px/1.25 Manrope,sans-serif;letter-spacing:-.03em}.sidebar-heading p{margin:6px 0 0;color:#9ba7b7;font-size:11px}.sidebar-section{padding:14px 10px;border-bottom:1px solid var(--edge)}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 10px;color:#9ba6b6;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.choice{display:flex;align-items:center;gap:9px;width:100%;min-height:42px;margin:0 0 3px;padding:9px 10px;background:transparent;color:#cbd3df;border:1px solid transparent;border-radius:3px;text-align:left;font-size:12px;font-weight:650}.choice:hover{background:#2b3039}.choice[aria-pressed=true]{color:#fff;background:rgba(237,52,72,.14);border-color:rgba(237,52,72,.3);box-shadow:inset 3px 0 0 var(--red)}.choice-dot{width:7px;height:7px;border-radius:50%;background:#667487;flex:0 0 auto}.choice[aria-pressed=true] .choice-dot{background:var(--red)}.choice-text{flex:1}.map-panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#15181e;overflow:hidden}.map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:7px 13px;background:#1e222a;border-bottom:1px solid var(--edge)}.map-title{font:800 12px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-actions{display:flex;align-items:center;gap:4px}.map-stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:auto;background:#1a1e25}.map-image{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.map-image[hidden],.bom-frame[hidden]{display:none!important}.map-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;color:#d8dfeb;background:rgba(26,30,38,.88);border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:11px;text-align:center}.map-status[hidden]{display:none!important}
@media(max-width:900px){.header-inner{gap:12px}.brand-logo{width:125px}.header-nav{gap:12px}.header-nav a{font-size:11px}.app{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:700px){html,body{height:auto;min-height:100%;overflow:auto}.container-sideral{width:calc(100% - 26px)}.header-inner{min-height:66px}.brand-logo{width:115px;max-height:42px}.root-mark{width:30px}.header-nav{display:none}.mobile-menu-button{display:inline-grid;place-items:center;width:36px;height:36px;background:transparent;color:#fff;border:1px solid #48505c;border-radius:3px}.mobile-nav:not([hidden]){display:flex;flex-direction:column;padding:8px 16px 12px;border-top:1px solid var(--edge)}.mobile-nav a{padding:9px 0}.app{height:auto;min-height:calc(100dvh - 66px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(58vh,1fr);overflow:visible}.toolbar{grid-column:1;padding:5px 6px;gap:4px;flex-wrap:wrap}.sidebar{grid-row:2;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--edge)}.sidebar-section{padding:10px}.map-panel{grid-row:3;min-height:58vh}.map-stage{min-height:58vh}.tool-btn{min-width:29px;height:30px;padding-inline:6px}.map-image{min-height:56vh}}
</style>
<link rel="stylesheet" href="css/site-header.css">
</head>
<body>
<header class="site-header"><div class="container-sideral header-inner"><div class="brand-lockup"><a class="brand" href="index.html" aria-label="Sideral Meteorologia"><img class="brand-logo" src="assets/sideral-logo.png" alt="Sideral Meteorologia" width="380" height="213"></a><svg class="root-mark" viewBox="0 0 40 26" width="40" height="26" role="img" aria-label="Sideral V3"><path class="root-sign" d="M1 15 H5.5 L8.5 23.5 L15 2"></path><path class="root-bar" d="M14.2 2 H31.5"></path><text class="root-value" x="23" y="21.5">3</text></svg></div><nav class="header-nav" aria-label="Navegação principal"><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav><div class="header-actions"><button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button></div></div><nav class="mobile-nav" id="mobile-nav" hidden><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav></header>
<main class="app" id="aaoApp">
<div class="toolbar" role="toolbar" aria-label="Controles da Oscilação Antártica">
<button class="tool-btn" id="fullscreen" title="Tela cheia" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
<button class="tool-btn" id="toggleSidebar" title="Mostrar/ocultar painel" aria-label="Mostrar ou ocultar painel" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg></button>
<button class="tool-btn" id="refresh" title="Atualizar gráfico" aria-label="Atualizar gráfico"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></svg></button>
<div class="toolbar-spacer"></div><span id="counter" style="font-size:11px;font-weight:800">1/2</span>
<button class="tool-btn" id="openImage" title="Abrir gráfico NOAA" aria-label="Abrir gráfico NOAA"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg></button>
<button class="tool-btn" id="download" title="Baixar gráfico" aria-label="Baixar gráfico"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></svg></button>
</div>
<aside class="sidebar" id="sidebar"><div class="sidebar-heading"><h1>Oscilação Antártica (AAO)</h1><p id="selectedSource">NCEP/NOAA [M]</p></div><section class="sidebar-section"><h2 class="section-label">Modelo</h2><button class="choice" data-source="noaa" aria-pressed="true"><span class="choice-dot"></span><span class="choice-text">NCEP/NOAA [M]</span></button><button class="choice" data-source="bom" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">BOM [M]</span></button></section></aside>
<section class="map-panel" id="mapPanel"><div class="map-head"><span class="map-title" id="mapTitle">AAO Index: Observed &amp; GEFS Forecasts</span></div><div class="map-stage"><img class="map-image" id="mapImage" alt="Índice da Oscilação Antártica observado e previsão GEFS do NOAA/CPC" decoding="async" referrerpolicy="no-referrer"><span class="map-status" id="status" hidden>Imagem indisponível</span></div></section>
</main>
<script>
(()=>{'use strict';
const NOAA_IMAGE='https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/aao/aao.gefs.fcst.png';
const BOM_DAILY='https://www.bom.gov.au/clim_data/IDCK000080/sam_index.daily.';
let activeImageUrl=NOAA_IMAGE;
let source='noaa', token=0;
const image=document.getElementById('mapImage'),status=document.getElementById('status'),counter=document.getElementById('counter'),title=document.getElementById('mapTitle'),selectedSource=document.getElementById('selectedSource');
function setPressed(){document.querySelectorAll('[data-source]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.source===source)));selectedSource.textContent=source==='noaa'?'NCEP/NOAA [M]':'BOM [M]';counter.textContent=source==='noaa'?'1/2':'2/2';}
function dateStamp(date){return date.getUTCFullYear()+String(date.getUTCMonth()+1).padStart(2,'0')+String(date.getUTCDate()).padStart(2,'0');}
function bomCandidates(){const base=new Date();base.setUTCHours(0,0,0,0);const urls=[];for(let back=0;back<=10;back++){const d=new Date(base);d.setUTCDate(d.getUTCDate()-back);urls.push(BOM_DAILY+dateStamp(d)+'.png?'+Date.now());}return urls;}
function probeImage(url,timeoutMs=6500){return new Promise(resolve=>{const probe=new Image();let done=false;const finish=value=>{if(done)return;done=true;clearTimeout(timer);probe.onload=null;probe.onerror=null;resolve(value);};const timer=setTimeout(()=>finish(null),timeoutMs);probe.referrerPolicy='no-referrer';probe.onload=()=>finish(probe.naturalWidth>0?url:null);probe.onerror=()=>finish(null);probe.src=url;});}
async function loadBom(id){title.textContent='Índice SAM diário · BOM';activeImageUrl='';image.hidden=true;image.removeAttribute('src');status.hidden=true;const urls=bomCandidates();const results=await Promise.all(urls.map(url=>probeImage(url)));if(id!==token)return;const available=results.find(Boolean);if(!available){image.hidden=true;status.hidden=true;return;}activeImageUrl=available;image.alt='Índice diário da Southern Annular Mode (SAM), Bureau of Meteorology';image.hidden=false;image.src=available;status.hidden=true;}
function load(){const id=++token;setPressed();status.hidden=true;if(source==='bom'){loadBom(id);return;}title.textContent='AAO Index: Observed & GEFS Forecasts';activeImageUrl=NOAA_IMAGE;image.alt='Índice da Oscilação Antártica observado e previsão GEFS do NOAA/CPC';image.hidden=true;image.removeAttribute('src');const probe=new Image();probe.referrerPolicy='no-referrer';probe.onload=()=>{if(id!==token)return;image.src=NOAA_IMAGE;image.hidden=false;status.hidden=true;};probe.onerror=()=>{if(id!==token)return;image.hidden=true;status.hidden=true;};probe.src=NOAA_IMAGE;}
document.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>{source=button.dataset.source;load();}));
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('fullscreen').addEventListener('click',async()=>{try{const el=document.getElementById('mapPanel');if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen();}catch{}});
document.getElementById('toggleSidebar').addEventListener('click',e=>{const side=document.getElementById('sidebar'),hidden=side.style.display==='none';side.style.display=hidden?'':'none';e.currentTarget.setAttribute('aria-pressed',String(hidden));document.getElementById('aaoApp').style.gridTemplateColumns=hidden?'258px minmax(0,1fr)':'minmax(0,1fr)';});
document.getElementById('openImage').title='Abrir imagem atual';document.getElementById('openImage').setAttribute('aria-label','Abrir imagem atual');document.getElementById('openImage').addEventListener('click',()=>{if(activeImageUrl)window.open(activeImageUrl,'_blank','noopener,noreferrer');});
document.getElementById('download').addEventListener('click',async()=>{if(!activeImageUrl)return;try{const response=await fetch(activeImageUrl,{mode:'cors',cache:'no-store'});if(!response.ok)throw new Error('fetch');const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=source==='bom'?'bom-sam-index-daily.png':'noaa-cpc-aao-gefs-forecast.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch{window.open(activeImageUrl,'_blank','noopener,noreferrer');}});
document.getElementById('mobileMenuButton').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav'),button=document.getElementById('mobileMenuButton'),open=nav.hidden;nav.hidden=!open;button.setAttribute('aria-expanded',String(open));});
load();
})();
</script>
</body></html>
