<style>
:root{color-scheme:dark;--bg:#171a20;--panel:#22262e;--panel2:#2b3039;--edge:rgba(255,255,255,.09);--ink:#edf1f7;--muted:#9ba7b7;--red:#ed3448}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}.container-sideral{width:min(100% - 48px,1480px);margin-inline:auto}
.site-header{position:relative;z-index:10;background:#20242c;border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:10px}.brand-lockup{display:flex;align-items:center;gap:11px}.brand{display:inline-flex;align-items:center}.brand-logo{display:block;width:150px;height:auto;max-height:55px;object-fit:contain}.root-sign,.root-bar{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.root-value{fill:var(--red);font:700 16px Manrope,sans-serif}.header-nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,32px);flex:1}.header-nav a,.mobile-nav a{color:#e8edf5;font-size:12px;font-weight:700;text-decoration:none}.header-nav a:hover,.mobile-nav a:hover{color:#ff7a87}.header-actions{display:flex;align-items:center}.mobile-menu-button,.mobile-nav{display:none}
.app{height:calc(100vh - 78px);min-height:320px;display:grid;grid-template-columns:258px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:#171a20}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:6px 12px;background:#262b34;border-bottom:1px solid #11151b;min-width:0}.tool-btn{display:inline-grid;place-items:center;flex:0 0 auto;min-width:33px;height:32px;padding:0 9px;background:transparent;color:#eaf0f8;border:1px solid transparent;border-radius:3px;font-weight:700}.tool-btn:hover,.tool-btn[aria-pressed=true]{background:rgba(237,52,72,.15);border-color:rgba(237,52,72,.45)}.tool-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.toolbar-spacer{flex:1}.sidebar{min-width:0;overflow:auto;background:#22262e;border-right:1px solid rgba(0,0,0,.3)}.sidebar-heading{padding:17px 16px;background:#2b3039;border-bottom:1px solid var(--edge)}.sidebar-heading h1{margin:0;font:800 15px/1.25 Manrope,sans-serif;letter-spacing:-.03em}.sidebar-heading p{margin:6px 0 0;color:#9ba7b7;font-size:11px}.sidebar-section{padding:14px 10px;border-bottom:1px solid var(--edge)}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 10px;color:#9ba6b6;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.choice{display:flex;align-items:center;gap:9px;width:100%;min-height:42px;margin:0 0 3px;padding:9px 10px;background:transparent;color:#cbd3df;border:1px solid transparent;border-radius:3px;text-align:left;font-size:12px;font-weight:650}.choice:hover{background:#2b3039}.choice[aria-pressed=true]{color:#fff;background:rgba(237,52,72,.14);border-color:rgba(237,52,72,.3);box-shadow:inset 3px 0 0 var(--red)}.choice-dot{width:7px;height:7px;border-radius:50%;background:#667487;flex:0 0 auto}.choice[aria-pressed=true] .choice-dot{background:var(--red)}.choice-text{flex:1}.choice-switch{margin-left:auto;flex:0 0 auto;width:30px;height:17px;border-radius:9px;background:#454d59;position:relative;transition:background .15s}.choice-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#dfe4eb;transition:left .15s}.choice[aria-pressed=true] .choice-switch{background:var(--red)}.choice[aria-pressed=true] .choice-switch::after{left:15px}
.time-row{padding:4px 6px 2px}.time-row input[type=range]{width:100%;accent-color:var(--red);background:transparent}.time-label{display:flex;justify-content:space-between;align-items:center;margin:0 6px 8px;color:#cbd3df;font-size:11px;font-weight:650}.time-label span:last-child{color:#9ba7b7;font-weight:600}
.map-panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#15181e;overflow:hidden}.map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:7px 13px;background:#1e222a;border-bottom:1px solid var(--edge)}.map-title{font:800 12px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-actions{display:flex;align-items:center;gap:4px}.map-stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:auto;background:#1a1e25}.map-image{display:block;width:100%;height:100%;object-fit:contain;background:#0e1013}.map-image[hidden]{display:none!important}.map-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.map-overlay[hidden]{display:none!important}.map-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;color:#d8dfeb;background:rgba(26,30,38,.88);border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:11px;text-align:center}.map-status[hidden]{display:none!important}
@media(max-width:900px){.header-inner{gap:12px}.brand-logo{width:125px}.header-nav{gap:12px}.header-nav a{font-size:11px}.app{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:700px){html,body{height:auto;min-height:100%;overflow:auto}.container-sideral{width:calc(100% - 26px)}.header-inner{min-height:66px}.brand-logo{width:115px;max-height:42px}.root-mark{width:30px}.header-nav{display:none}.mobile-menu-button{display:inline-grid;place-items:center;width:36px;height:36px;background:transparent;color:#fff;border:1px solid #48505c;border-radius:3px}.mobile-nav:not([hidden]){display:flex;flex-direction:column;padding:8px 16px 12px;border-top:1px solid var(--edge)}.mobile-nav a{padding:9px 0}.app{height:auto;min-height:calc(100dvh - 66px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(58vh,1fr);overflow:visible}.toolbar{grid-column:1;padding:5px 6px;gap:4px;flex-wrap:wrap}.sidebar{grid-row:2;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--edge)}.sidebar-section{padding:10px}.map-panel{grid-row:3;min-height:58vh}.map-stage{min-height:58vh}.tool-btn{min-width:29px;height:30px;padding-inline:6px}.map-image{min-height:56vh}}
</style>

<body>

<header class="site-header"><div class="container-sideral header-inner"><div class="brand-lockup"><a class="brand" href="index.html" aria-label="Sideral Meteorologia"><img class="brand-logo" src="assets/sideral-logo.png" alt="Sideral Meteorologia" width="380" height="213"></a><svg class="root-mark" viewBox="0 0 40 26" width="40" height="26" role="img" aria-label="Sideral V3"><path class="root-sign" d="M1 15 H5.5 L8.5 23.5 L15 2"></path><path class="root-bar" d="M14.2 2 H31.5"></path><text class="root-value" x="23" y="21.5">3</text></svg></div><nav class="header-nav" aria-label="Navegação principal"><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav><div class="header-actions"><button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button></div></div><nav class="mobile-nav" id="mobile-nav" hidden><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav></header>

<main class="app" id="arApp">

<div class="toolbar" role="toolbar" aria-label="Controles do painel">
<button class="tool-btn" id="fullscreen" title="Tela cheia" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
<button class="tool-btn" id="toggleSidebar" title="Mostrar/ocultar painel" aria-label="Mostrar ou ocultar painel" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg></button>
<button class="tool-btn" id="refresh" title="Atualizar imagem" aria-label="Atualizar imagem"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></svg></button>
<div class="toolbar-spacer"></div><span id="counter" style="font-size:11px;font-weight:800">1/5</span>
<button class="tool-btn" id="openImage" title="Abrir imagem NASA GIBS" aria-label="Abrir imagem NASA GIBS"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg></button>
<button class="tool-btn" id="download" title="Baixar imagem" aria-label="Baixar imagem"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></svg></button>
</div>

<aside class="sidebar" id="sidebar"><div class="sidebar-heading"><h1>Qualidade do Ar</h1><p id="selectedSource">Poeira (Dust Score) [D]</p></div><section class="sidebar-section"><h2 class="section-label">Camada</h2><button class="choice" data-source="dust" aria-pressed="true"><span class="choice-dot"></span><span class="choice-text">Poeira (Dust Score) [D]</span></button><button class="choice" data-source="co_mixing" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">Monóxido de Carbono (perfil) [D]</span></button><button class="choice" data-source="co_night" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">Monóxido de Carbono — Coluna (Noite) [D]</span></button><button class="choice" data-source="so2_day" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">SO₂ Vulcânico — Dia [D]</span></button><button class="choice" data-source="so2_night" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">SO₂ Vulcânico — Noite [D]</span></button></section><section class="sidebar-section" id="timeSection"><h2 class="section-label">Data</h2><div class="time-label"><span id="timeSliderDateLabel">hoje</span><span id="timeSliderRelLabel">mais recente</span></div><div class="time-row"><input type="range" id="timeSlider" min="0" max="14" step="1" value="0" aria-label="Selecionar data"></div></section><section class="sidebar-section"><h2 class="section-label">Camadas extras</h2><button class="choice" id="bordersChoice" type="button" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">Fronteiras</span><span class="choice-switch" aria-hidden="true"></span></button></section></aside>
<section class="map-panel" id="mapPanel"><div class="map-head"><span class="map-title" id="mapTitle">Índice de Poeira em Suspensão</span></div><div class="map-stage"><img class="map-image" id="mapImage" alt="Mapa global de poeira em suspensão na atmosfera, NASA GIBS AIRS" decoding="async" referrerpolicy="no-referrer"><svg class="map-overlay" id="bordersOverlay" viewBox="0 0 1024 512" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Fronteiras dos países" hidden><path id="bordersHalo" fill="none" stroke="#0b0d11" stroke-opacity=".55" stroke-width="1.6" vector-effect="non-scaling-stroke"></path><path id="bordersLine" fill="none" stroke="#ffe36b" stroke-opacity=".92" stroke-width="0.6" vector-effect="non-scaling-stroke"></path></svg><span class="map-status" id="status" hidden>Imagem indisponível</span></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(()=>{'use strict';
const SOURCES=[{id:'dust',label:'Poeira (Dust Score) [D]',title:'Índice de Poeira em Suspensão',alt:'Mapa global de poeira em suspensão na atmosfera, NASA GIBS AIRS',layer:'AIRS_Dust_Score',filename:'nasa-gibs-airs-dust-score.png',daily:true},
{id:'co_mixing',label:'Monóxido de Carbono (perfil) [D]',title:'Monóxido de Carbono — Razão de Mistura',alt:'Mapa global de razão de mistura de monóxido de carbono, NASA GIBS AIRS',layer:'AIRS_Carbon_Monoxide_Volume_Mixing_Ratio',filename:'nasa-gibs-airs-co-mixing-ratio.png',daily:true},
{id:'co_night',label:'Monóxido de Carbono — Coluna (Noite) [D]',title:'Monóxido de Carbono — Coluna Total (Noturna)',alt:'Mapa global de coluna total de monóxido de carbono, período noturno, NASA GIBS AIRS',layer:'AIRS_CO_Total_Column_Night',filename:'nasa-gibs-airs-co-total-column-night.png',daily:true},
{id:'so2_day',label:'SO₂ Vulcânico — Dia [D]',title:'Índice de Dióxido de Enxofre Vulcânico (Diurno)',alt:'Mapa global de índice de SO2 vulcânico, período diurno, NASA GIBS AIRS',layer:'AIRS_Prata_SO2_Index_Day',filename:'nasa-gibs-airs-so2-day.png',daily:true},
{id:'so2_night',label:'SO₂ Vulcânico — Noite [D]',title:'Índice de Dióxido de Enxofre Vulcânico (Noturno)',alt:'Mapa global de índice de SO2 vulcânico, período noturno, NASA GIBS AIRS',layer:'AIRS_Prata_SO2_Index_Night',filename:'nasa-gibs-airs-so2-night.png',daily:true}];
const SUBDOMAINS=['gibs-a','gibs-b','gibs-c'];
const BBOX='-180,-90,180,90';
const SIZE={w:1024,h:512};
const MAX_BACK=14;
let activeImageUrl='',source='dust',token=0,bordersOn=false,currentOffset=0;
const image=document.getElementById('mapImage'),status=document.getElementById('status'),counter=document.getElementById('counter'),title=document.getElementById('mapTitle'),selectedSource=document.getElementById('selectedSource'),bordersOverlay=document.getElementById('bordersOverlay'),bordersChoice=document.getElementById('bordersChoice'),timeSection=document.getElementById('timeSection'),timeSlider=document.getElementById('timeSlider'),timeDateLabel=document.getElementById('timeSliderDateLabel'),timeRelLabel=document.getElementById('timeSliderRelLabel');
function findSource(id){return SOURCES.find(s=>s.id===id);}
function setPressed(){document.querySelectorAll('[data-source]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.source===source)));const s=findSource(source);selectedSource.textContent=s.label;const idx=SOURCES.indexOf(s)+1;counter.textContent=idx+'/'+SOURCES.length;}
function dateStamp(date){return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0')+'-'+String(date.getUTCDate()).padStart(2,'0');}
function dateForOffset(offset){const base=new Date();base.setUTCHours(0,0,0,0);base.setUTCDate(base.getUTCDate()-offset);return base;}
function formatDateBR(d){return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();}
function wmsUrl(layer,dateStr,sub){let url='https://'+sub+'.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&FORMAT=image%2Fpng&STYLES=&TRANSPARENT=true&LAYERS='+encodeURIComponent(layer)+'&WIDTH='+SIZE.w+'&HEIGHT='+SIZE.h+'&SRS=EPSG%3A4326&BBOX='+BBOX;if(dateStr)url+='&TIME='+dateStr+'T00:00:00Z';return url;}
function urlsForOffset(s,offset){if(!s.daily)return SUBDOMAINS.map(sub=>wmsUrl(s.layer,'',sub));const stamp=dateStamp(dateForOffset(offset));return SUBDOMAINS.map(sub=>wmsUrl(s.layer,stamp,sub));}
function probeImage(url,timeoutMs=7000){return new Promise(resolve=>{const probe=new Image();let done=false;const finish=value=>{if(done)return;done=true;clearTimeout(timer);probe.onload=null;probe.onerror=null;resolve(value);};const timer=setTimeout(()=>finish(null),timeoutMs);probe.referrerPolicy='no-referrer';probe.onload=()=>finish(probe.naturalWidth>8?url:null);probe.onerror=()=>finish(null);probe.src=url;});}
async function probeSequential(urls,id){for(const url of urls){if(id!==token)return null;const ok=await probeImage(url);if(ok)return ok;}return null;}
function updateTimeUI(s){if(!s.daily){timeSection.hidden=true;return;}timeSection.hidden=false;timeSlider.value=String(currentOffset);timeDateLabel.textContent=formatDateBR(dateForOffset(currentOffset));timeRelLabel.textContent=currentOffset===0?'mais recente':(currentOffset===1?'1 dia atrás':currentOffset+' dias atrás');}
const bordersHalo=document.getElementById('bordersHalo'),bordersLine=document.getElementById('bordersLine');
let bordersReady=false,bordersBuilding=null;
async function ensureBorders(){if(bordersReady)return true;if(bordersBuilding)return bordersBuilding;bordersBuilding=(async()=>{try{const topology=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');const projection=d3.geoEquirectangular().fitSize([1024,512],{type:'Sphere'});const path=d3.geoPath(projection);const mesh=topojson.mesh(topology,topology.objects.countries);const d=path(mesh);bordersHalo.setAttribute('d',d);bordersLine.setAttribute('d',d);bordersReady=true;return true;}catch(e){return false;}})();return bordersBuilding;}
async function applyBordersVisibility(){if(!bordersOn){bordersOverlay.hidden=true;return;}const ok=await ensureBorders();bordersOverlay.hidden=!ok;}
bordersChoice.addEventListener('click',()=>{bordersOn=!bordersOn;bordersChoice.setAttribute('aria-pressed',String(bordersOn));applyBordersVisibility();});
async function loadWithFallback(){const id=++token;setPressed();status.hidden=true;const s=findSource(source);title.textContent=s.title;image.alt=s.alt;activeImageUrl='';image.hidden=true;image.removeAttribute('src');updateTimeUI(s);if(!s.daily){const found=await probeSequential(urlsForOffset(s,0),id);if(id!==token)return;if(!found){status.hidden=false;return;}activeImageUrl=found;image.src=found;image.hidden=false;applyBordersVisibility();return;}for(let off=0;off<=MAX_BACK;off++){if(id!==token)return;const found=await probeSequential(urlsForOffset(s,off),id);if(id!==token)return;if(found){currentOffset=off;activeImageUrl=found;image.src=found;image.hidden=false;updateTimeUI(s);applyBordersVisibility();return;}}status.hidden=false;}
async function loadForOffset(offset){const id=++token;const s=findSource(source);if(!s.daily)return;status.hidden=true;currentOffset=offset;updateTimeUI(s);const found=await probeSequential(urlsForOffset(s,offset),id);if(id!==token)return;if(!found){status.hidden=false;return;}activeImageUrl=found;image.src=found;image.hidden=false;status.hidden=true;applyBordersVisibility();}
document.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>{source=button.dataset.source;loadWithFallback();}));
document.getElementById('refresh').addEventListener('click',loadWithFallback);
timeSlider.addEventListener('input',()=>{const s=findSource(source);timeDateLabel.textContent=formatDateBR(dateForOffset(Number(timeSlider.value)));timeRelLabel.textContent=timeSlider.value==='0'?'mais recente':timeSlider.value+' dias atrás';});
timeSlider.addEventListener('change',()=>{loadForOffset(Number(timeSlider.value));});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{const el=document.getElementById('mapPanel');if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen();}catch{}});
document.getElementById('toggleSidebar').addEventListener('click',e=>{const side=document.getElementById('sidebar'),hidden=side.style.display==='none';side.style.display=hidden?'':'none';e.currentTarget.setAttribute('aria-pressed',String(hidden));document.getElementById('app' in window?'app':'aaoApp').style.gridTemplateColumns=hidden?'258px minmax(0,1fr)':'minmax(0,1fr)';});
document.getElementById('openImage').addEventListener('click',()=>{if(activeImageUrl)window.open(activeImageUrl,'_blank','noopener,noreferrer');});
document.getElementById('download').addEventListener('click',async()=>{if(!activeImageUrl)return;const s=findSource(source);try{const response=await fetch(activeImageUrl,{mode:'cors',cache:'no-store'});if(!response.ok)throw new Error('fetch');const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=s.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch{window.open(activeImageUrl,'_blank','noopener,noreferrer');}});
document.getElementById('mobileMenuButton').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav'),button=document.getElementById('mobileMenuButton'),open=nav.hidden;nav.hidden=!open;button.setAttribute('aria-expanded',String(open));});
loadWithFallback();
})();
</script>
</body></html>
