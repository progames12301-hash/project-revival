*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.container-sideral{width:min(100% - 48px,1480px);margin-inline:auto}.site-header{position:relative;z-index:10;background:#20242c;border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:10px}.brand-lockup{display:flex;align-items:center;gap:11px}.brand{display:inline-flex;align-items:center}.brand-logo{display:block;width:150px;height:auto;max-height:55px;object-fit:contain}.root-sign,.root-bar{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.root-value{fill:var(--red);font:700 16px Manrope,sans-serif}.header-nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,32px);flex:1}.header-nav a,.mobile-nav a{color:#e8edf5;font-size:12px;font-weight:700;text-decoration:none}.header-nav a:hover,.mobile-nav a:hover{color:#ff7a87}.header-actions{display:flex;align-items:center}.mobile-menu-button,.mobile-nav{display:none}.app{height:calc(100vh - 78px);min-height:320px;display:grid;grid-template-columns:258px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:#171a20}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:6px 12px;background:#262b34;border-bottom:1px solid #11151b;min-width:0}.tool-btn{display:inline-grid;place-items:center;flex:0 0 auto;min-width:33px;height:32px;padding:0 9px;background:#2c323c;color:#eaf0f8;border:1px solid #444b57;border-radius:3px;font-weight:700}.tool-btn:hover{border-color:var(--red)}.tool-btn[aria-pressed=true],.tool-btn.active{background:var(--red);border-color:var(--red);color:#fff}.toolbar-spacer{flex:1}.toolbar-label{font-size:11px;color:#bdc7d5;font-weight:800;white-space:nowrap}.timeline-range{width:min(40vw,560px);min-width:70px;accent-color:var(--red)}.readout{min-width:54px;text-align:right;font-size:11px;font-weight:800;white-space:nowrap}.sidebar{min-width:0;overflow:auto;background:#22262e;border-right:1px solid rgba(0,0,0,.3)}.sidebar-heading{padding:17px 16px;background:#2b3039;border-bottom:1px solid var(--edge)}.sidebar-heading h1{margin:0;font:800 15px/1.25 Manrope,sans-serif;letter-spacing:-.03em}.sidebar-section{padding:14px 10px;border-bottom:1px solid var(--edge)}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 10px;color:#9ba6b6;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.choice{display:flex;align-items:center;gap:9px;width:100%;min-height:39px;margin:0 0 3px;padding:9px 10px;background:transparent;color:#cbd3df;border:1px solid transparent;border-radius:3px;text-align:left;font-size:12px;font-weight:650}.choice:hover{background:#2b3039}.choice[aria-pressed=true]{color:#fff;background:rgba(237,52,72,.14);border-color:rgba(237,52,72,.3);box-shadow:inset 3px 0 0 var(--red)}.choice-dot{width:7px;height:7px;border-radius:50%;background:#667487;flex:0 0 auto}.choice[aria-pressed=true] .choice-dot{background:var(--red)}.choice-text{flex:1}.cycle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.cycle-choice{height:32px;background:#292e37;color:#bcc6d5;border:1px solid var(--edge);border-radius:3px;font-size:11px;font-weight:800}.cycle-choice[aria-pressed=true]{background:rgba(237,52,72,.16);border-color:rgba(237,52,72,.6);color:#fff}.map-panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#15181e;overflow:hidden}.map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:7px 13px;background:#1e222a;border-bottom:1px solid var(--edge)}.map-title{font:800 12px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:hidden;background:#15181e}.map-image{display:block;width:100%;height:100%;object-fit:contain;background:#15181e}.map-canvas{display:block;width:100%;height:100%;background:#15181e}.map-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;color:#d8dfeb;background:rgba(26,30,38,.88);border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:11px;text-align:center;white-space:nowrap}.map-status[hidden]{display:none!important}.download-btn{background:#303641;color:#eaf0f8;border:1px solid #454d5b;border-radius:3px;height:32px;padding:0 10px;font-size:11px;font-weight:800}.download-btn:hover{border-color:var(--red)}

<main class="app noaa-app" id="noaaApp"><div class="toolbar" role="toolbar"><button class="tool-btn" id="noaaFullscreen" aria-label="Tela cheia" title="Tela cheia">⛶</button><button class="tool-btn" id="noaaDownload" aria-label="Baixar imagem" title="Baixar mapa">↓</button><span class="toolbar-spacer"></span><span class="toolbar-label" id="noaaCurrentLabel">Superfície · 00Z</span></div><aside class="sidebar noaa-sidebar"><div class="sidebar-heading"><h1>Análise Sinótica NOAA</h1></div><section class="sidebar-section"><h2 class="section-label">Produtos</h2><button class="choice" data-product="surface" aria-pressed="true"><span class="choice-dot"></span><span class="choice-text">Análise de superfície</span></button><button class="choice" data-product="satellite" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">Satélite + superfície</span></button><button class="choice" data-product="jet" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">Análise do jato</span></button><button class="choice" data-product="forecast" aria-pressed="false"><span class="choice-dot"></span><span class="choice-text">Previsão de superfície</span></button></section><section class="sidebar-section cycle-area" id="cycleArea"><h2 class="section-label">Ciclo</h2><div class="cycle-grid four"><button class="cycle-choice" data-cycle="00" aria-pressed="true">00Z</button><button class="cycle-choice" data-cycle="06" aria-pressed="false">06Z</button><button class="cycle-choice" data-cycle="12" aria-pressed="false">12Z</button><button class="cycle-choice" data-cycle="18" aria-pressed="false">18Z</button></div></section><section class="sidebar-section day-area" id="dayArea" hidden><h2 class="section-label">Previsão</h2><div class="cycle-grid"><button class="cycle-choice" data-day="1" aria-pressed="true">Dia 1</button><button class="cycle-choice" data-day="2" aria-pressed="false">Dia 2</button><button class="cycle-choice" data-day="3" aria-pressed="false">Dia 3</button><button class="cycle-choice" data-day="4" aria-pressed="false">Dia 4</button><button class="cycle-choice" data-day="5" aria-pressed="false">Dia 5</button><button class="cycle-choice" data-day="6" aria-pressed="false">Dia 6</button></div></section><section class="sidebar-section" id="jetArea" hidden><h2 class="section-label">Ciclo</h2><button class="cycle-choice" disabled aria-pressed="true">00Z</button></section></aside><section class="map-panel" id="noaaMapPanel"><div class="map-head"><span class="map-title" id="noaaMapTitle">Análise de superfície · 00Z</span><button class="tool-btn" id="noaaRetry" title="Atualizar imagem" aria-label="Atualizar">↻</button></div><div class="map-stage"><img class="map-image" id="noaaImage" alt="Carta sinótica NOAA para a América do Sul" decoding="async" referrerpolicy="no-referrer"><span class="map-status" id="noaaStatus" hidden>Imagem indisponível</span></div></section></main>
<script>(()=>{'use strict';const base='https://www.wpc.ncep.noaa.gov/international/';let product='surface',cycle='00',day=1,request=0;const img=document.getElementById('noaaImage'),status=document.getElementById('noaaStatus');function currentUrl(){if(product==='surface')return `${base}sampssfc${cycle}.gif`;if(product==='satellite')return `${base}sampssfc${cycle}sat.gif`;if(product==='jet')return `${base}samjet00.gif`;return `${base}d${day}.gif`;}function currentLabel(){return product==='surface'?`Análise de superfície · ${cycle}Z`:product==='satellite'?`Satélite + superfície · ${cycle}Z`:product==='jet'?'Análise do jato · 00Z':`Previsão de superfície · Dia ${day}`;}function update(){document.querySelectorAll('[data-product]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.product===product)));document.querySelectorAll('[data-cycle]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cycle===cycle)));document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.day)===day)));document.getElementById('cycleArea').hidden=!['surface','satellite'].includes(product);document.getElementById('dayArea').hidden=product!=='forecast';document.getElementById('jetArea').hidden=product!=='jet';document.getElementById('noaaCurrentLabel').textContent=currentLabel();document.getElementById('noaaMapTitle').textContent=currentLabel();}function load(){const token=++request;status.hidden=true;img.hidden=true;img.removeAttribute('src');const url=currentUrl();img.onload=()=>{if(token!==request)return;img.hidden=false;status.hidden=true;};img.onerror=()=>{if(token!==request)return;img.hidden=true;status.textContent='Imagem indisponível';status.hidden=false;};img.src=url;update();}document.querySelectorAll('[data-product]').forEach(b=>b.addEventListener('click',()=>{product=b.dataset.product;load();}));document.querySelectorAll('[data-cycle]').forEach(b=>b.addEventListener('click',()=>{cycle=b.dataset.cycle;load();}));document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{day=Number(b.dataset.day);load();}));document.getElementById('noaaRetry').addEventListener('click',load);document.getElementById('noaaFullscreen').addEventListener('click',async()=>{try{const el=document.getElementById('noaaMapPanel');if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen();}catch{}});async function getBlob(url){for(const source of [url,`https://wsrv.nl/?url=${encodeURIComponent(url)}&output=jpg&maxage=1d`]){try{const r=await fetch(source,{mode:'cors',cache:'no-store'});if(r.ok){const b=await r.blob();if(b.size>2000)return b;}}catch{}}throw new Error('download failed');}document.getElementById('noaaDownload').addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;try{const blob=await getBlob(currentUrl()),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;const ext=blob.type.includes('gif')?'gif':blob.type.includes('png')?'png':'jpg';a.download=`noaa-sinotica-${product}-${cycle}${product==='forecast'?'-dia'+day:''}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}catch{const a=document.createElement('a');a.href=currentUrl();a.download=`noaa-sinotica-${product}.gif`;a.rel='noopener';a.click();}finally{b.disabled=false;}});document.getElementById('mobileMenuButton').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav'),b=document.getElementById('mobileMenuButton'),open=nav.hidden;nav.hidden=!open;b.setAttribute('aria-expanded',String(open));});load();})();</script></body></html>
