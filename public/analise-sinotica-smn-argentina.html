<style>
:root{color-scheme:dark;--bg:#171a20;--panel:#22262e;--panel2:#2b3039;--edge:rgba(255,255,255,.09);--ink:#edf1f7;--muted:#9ba7b7;--red:#ed3448}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.container-sideral{width:min(100% - 48px,1480px);margin-inline:auto}
.site-header{position:relative;z-index:10;background:#20242c;border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:10px}.brand-lockup{display:flex;align-items:center;gap:11px}.brand{display:inline-flex;align-items:center;text-decoration:none}.brand-logo{display:block;width:150px;height:auto;max-height:55px;object-fit:contain}.root-sign,.root-bar{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.root-value{fill:var(--red);font:700 16px Manrope,sans-serif}.header-nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,32px);flex:1}.header-nav a,.mobile-nav a{color:#e8edf5;font-size:12px;font-weight:700;text-decoration:none}.header-nav a:hover,.mobile-nav a:hover{color:#ff7a87}.header-actions{display:flex;align-items:center}.mobile-menu-button,.mobile-nav{display:none}
.app{height:calc(100vh - 78px);min-height:320px;display:grid;grid-template-columns:258px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:#171a20}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:6px 12px;background:#262b34;border-bottom:1px solid #11151b;min-width:0}.tool-btn{display:inline-grid;place-items:center;flex:0 0 auto;min-width:33px;height:32px;padding:0 9px;background:#2c323c;color:#eaf0f8;border:1px solid #444b57;border-radius:3px;font-weight:700}.tool-btn:hover{border-color:var(--red)}.tool-btn[aria-pressed=true],.tool-btn.active{background:var(--red);border-color:var(--red);color:#fff}.toolbar-spacer{flex:1}.toolbar-label{font-size:11px;color:#bdc7d5;font-weight:800;white-space:nowrap}.timeline-range{width:min(40vw,560px);min-width:70px;accent-color:var(--red)}.readout{min-width:48px;text-align:right;font-size:11px;font-weight:800;white-space:nowrap}
.sidebar{min-width:0;overflow:auto;background:#22262e;border-right:1px solid rgba(0,0,0,.3)}.sidebar-heading{padding:17px 16px;background:#2b3039;border-bottom:1px solid var(--edge)}.sidebar-heading h1{margin:0;font:800 15px/1.25 Manrope,sans-serif;letter-spacing:-.03em}.sidebar-heading p{margin:6px 0 0;color:#a5b0bf;font-size:11px}.sidebar-section{padding:14px 10px;border-bottom:1px solid var(--edge)}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 10px;color:#9ba6b6;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.hour-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.hour-choice{height:35px;background:#292e37;color:#bcc6d5;border:1px solid var(--edge);border-radius:3px;font-size:11px;font-weight:800}.hour-choice:hover{border-color:rgba(237,52,72,.6)}.hour-choice[aria-pressed=true]{background:rgba(237,52,72,.16);border-color:rgba(237,52,72,.6);color:#fff}
.map-panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#15181e;overflow:hidden}.map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:7px 13px;background:#1e222a;border-bottom:1px solid var(--edge)}.map-title{font:800 12px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:auto;background:#f7f8fa}.map-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#f7f8fa}.map-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 13px;color:#d8dfeb;background:rgba(26,30,38,.92);border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:11px;text-align:center;max-width:calc(100% - 30px)}.map-status[hidden]{display:none!important}.download-btn{background:#303641;color:#eaf0f8;border:1px solid #454d5b;border-radius:3px;height:32px;padding:0 10px;font-size:11px;font-weight:800}.download-btn:hover{border-color:var(--red)}.original-link{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
@media(max-width:900px){.header-inner{gap:12px}.brand-logo{width:125px}.header-nav{gap:12px}.header-nav a{font-size:11px}.app{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:700px){html,body{height:auto;min-height:100%;overflow:auto}.container-sideral{width:calc(100% - 26px)}.header-inner{min-height:66px}.brand-logo{width:115px;max-height:42px}.root-mark{width:30px}.header-nav{display:none}.mobile-menu-button{display:inline-grid;place-items:center;width:36px;height:36px;background:transparent;color:#fff;border:1px solid #48505c;border-radius:3px}.mobile-nav:not([hidden]){display:flex;flex-direction:column;padding:8px 16px 12px;border-top:1px solid var(--edge)}.mobile-nav a{padding:9px 0}.app{height:auto;min-height:calc(100dvh - 66px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(58vh,1fr);overflow:visible}.toolbar{grid-column:1;padding:5px 6px;gap:4px;flex-wrap:wrap}.sidebar{grid-row:2;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--edge)}.sidebar-section{padding:10px}.hour-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.map-panel{grid-row:3;min-height:58vh}.map-stage{min-height:58vh}.timeline-range{width:25vw;min-width:45px}.tool-btn{min-width:29px;height:30px;padding-inline:6px}.toolbar-label{font-size:10px}.map-image{max-width:100%;max-height:none;width:100%;height:auto;min-height:50vh}}
</style>
<link rel="stylesheet" href="css/site-header.css">
</head>
<body>
<header class="site-header"><div class="container-sideral header-inner"><div class="brand-lockup"><a class="brand" href="index.html" aria-label="Sideral Meteorologia"><img class="brand-logo" src="assets/sideral-logo.png" alt="Sideral Meteorologia" width="380" height="213"></a><svg class="root-mark" viewBox="0 0 40 26" width="40" height="26" role="img" aria-label="Sideral V3"><path class="root-sign" d="M1 15 H5.5 L8.5 23.5 L15 2"></path><path class="root-bar" d="M14.2 2 H31.5"></path><text class="root-value" x="23" y="21.5">3</text></svg></div><nav class="header-nav" aria-label="Navegação principal"><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav><div class="header-actions"><button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button></div></div><nav class="mobile-nav" id="mobile-nav" hidden><a href="index.html#ferramentas">Ferramentas</a><a href="index.html#modelos">Modelos</a><a href="index.html#skew-t">Skew-T</a><a href="index.html#sobre">Sobre a Sideral</a></nav></header>
<main class="app" id="smnApp">
<div class="toolbar" role="toolbar" aria-label="Controles da carta"><button class="tool-btn" id="smnFullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button><button class="tool-btn" id="smnPrev" title="Horário anterior" aria-label="Horário anterior">◀</button><button class="tool-btn" id="smnPlay" aria-label="Reproduzir horários" aria-pressed="false">▶</button><input class="timeline-range" id="smnRange" type="range" min="0" max="7" step="1" value="0" aria-label="Horário da carta"><span class="readout" id="smnHour">00Z</span><button class="tool-btn" id="smnNext" title="Próximo horário" aria-label="Próximo horário">▶</button><span class="toolbar-spacer"></span><a class="download-btn original-link" id="smnOriginalLink" href="https://ssl.smn.gob.ar/dpd/tiepre/cpi/v1_anasup00.gif" target="_blank" rel="noopener noreferrer" title="Abrir a carta original do SMN em nova aba">Abrir carta ↗</a><button class="download-btn" id="smnDownload" type="button">GIF ↓</button></div>
<aside class="sidebar" id="smnSidebar"><div class="sidebar-heading"><h1>Análise Sinótica · SMN Argentina</h1><p>Cartas a cada 3 horas</p></div><section class="sidebar-section"><h2 class="section-label">Horário UTC</h2><div class="hour-grid" id="hourGrid"><button class="hour-choice" data-hour="00" aria-pressed="true">00Z</button><button class="hour-choice" data-hour="03" aria-pressed="false">03Z</button><button class="hour-choice" data-hour="06" aria-pressed="false">06Z</button><button class="hour-choice" data-hour="09" aria-pressed="false">09Z</button><button class="hour-choice" data-hour="12" aria-pressed="false">12Z</button><button class="hour-choice" data-hour="15" aria-pressed="false">15Z</button><button class="hour-choice" data-hour="18" aria-pressed="false">18Z</button><button class="hour-choice" data-hour="21" aria-pressed="false">21Z</button></div></section></aside>
<section class="map-panel" id="smnMapPanel"><div class="map-head"><span class="map-title" id="smnMapTitle">Carta sinótica SMN · 00Z</span></div><div class="map-stage"><img class="map-image" id="smnImage" alt="Carta sinótica do SMN Argentina válida às 00Z" decoding="async" fetchpriority="high" referrerpolicy="no-referrer"></div></section>
</main>
<script>
(()=>{'use strict';
const BASE='https://ssl.smn.gob.ar/dpd/tiepre/cpi/v1_anasup';
const HOURS=['00','03','06','09','12','15','18','21'];
const image=document.getElementById('smnImage'),range=document.getElementById('smnRange'),hourLabel=document.getElementById('smnHour'),title=document.getElementById('smnMapTitle'),originalLink=document.getElementById('smnOriginalLink');
let index=0,playTimer=null,requestToken=0,loadedUrl='',activeCandidates=[],candidateIndex=0;
function urlFor(hour){return BASE+hour+'.gif';}
function proxyUrls(hour){
  const source='ssl.smn.gob.ar/dpd/tiepre/cpi/v1_anasup'+hour+'.gif';
  const wsrv=new URL('https://wsrv.nl/');wsrv.searchParams.set('url',source);wsrv.searchParams.set('maxage','5m');
  const weserv=new URL('https://images.weserv.nl/');weserv.searchParams.set('url',source);
  return [wsrv.toString(),weserv.toString()];
}
function updateControls(){const hour=HOURS[index];range.value=String(index);hourLabel.textContent=hour+'Z';title.textContent='Carta sinótica SMN · '+hour+'Z';image.alt='Carta sinótica do SMN Argentina válida às '+hour+'Z';originalLink.href=urlFor(hour);originalLink.setAttribute('aria-label','Abrir carta original do SMN '+hour+'Z em nova aba');document.querySelectorAll('[data-hour]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hour===hour)));}
function load(){
  const token=++requestToken,hour=HOURS[index];updateControls();loadedUrl='';candidateIndex=0;activeCandidates=proxyUrls(hour);image.style.visibility='hidden';image.removeAttribute('src');
  image.onload=()=>{if(token!==requestToken)return;loadedUrl=activeCandidates[candidateIndex];image.style.visibility='visible';};
  image.onerror=()=>{if(token!==requestToken)return;candidateIndex++;if(candidateIndex<activeCandidates.length){image.src=activeCandidates[candidateIndex];return;}image.style.visibility='hidden';};
  image.referrerPolicy='no-referrer';image.src=activeCandidates[candidateIndex];
}
function setIndex(v){index=(Number(v)+HOURS.length)%HOURS.length;load();}
function stop(){if(playTimer)clearInterval(playTimer);playTimer=null;const b=document.getElementById('smnPlay');b.setAttribute('aria-pressed','false');b.textContent='▶';}
document.querySelectorAll('[data-hour]').forEach(b=>b.addEventListener('click',()=>{stop();index=HOURS.indexOf(b.dataset.hour);load();}));
range.addEventListener('input',()=>{index=Number(range.value);updateControls();});range.addEventListener('change',()=>load());
document.getElementById('smnPrev').addEventListener('click',()=>{stop();setIndex(index-1);});document.getElementById('smnNext').addEventListener('click',()=>{stop();setIndex(index+1);});
document.getElementById('smnPlay').addEventListener('click',()=>{if(playTimer){stop();return;}const b=document.getElementById('smnPlay');b.setAttribute('aria-pressed','true');b.textContent='Ⅱ';playTimer=setInterval(()=>setIndex(index+1),1400);});
document.getElementById('smnFullscreen').addEventListener('click',async()=>{try{const el=document.getElementById('smnMapPanel');if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen();}catch{}});
document.getElementById('smnDownload').addEventListener('click',async()=>{const btn=document.getElementById('smnDownload');if(!loadedUrl)return;btn.disabled=true;try{const response=await fetch(loadedUrl,{mode:'cors',cache:'no-store'});if(!response.ok)throw new Error('download');const blob=await response.blob();const blobUrl=URL.createObjectURL(blob),a=document.createElement('a');a.href=blobUrl;a.download='smn-carta-sinotica-'+HOURS[index]+'.gif';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(blobUrl),5000);}catch{const a=document.createElement('a');a.href=loadedUrl;a.target='_blank';a.rel='noopener noreferrer';a.download='smn-carta-sinotica-'+HOURS[index]+'.gif';document.body.appendChild(a);a.click();a.remove();}finally{btn.disabled=false;}});
document.getElementById('mobileMenuButton').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav'),b=document.getElementById('mobileMenuButton'),open=nav.hidden;nav.hidden=!open;b.setAttribute('aria-expanded',String(open));});
image.addEventListener('load',()=>{image.style.visibility='visible';});load();
})();
</script>
</body></html>
